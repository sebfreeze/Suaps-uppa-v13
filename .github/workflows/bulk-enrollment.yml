name: Bulk enrollment safety

on:
  push:
    branches:
      - ops/bulk-enroll-running-s1-20260914

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply private bulk enrollment bridge
        run: python .github/scripts/patch_bulk_enrollment.py
      - name: Compile
        run: python -m py_compile bulk_enrollment.py v14_core.py .github/scripts/patch_bulk_enrollment.py
      - name: Bulk enrollment tests
        run: python -m pytest -q tests/test_bulk_enrollment.py
      - name: Regression tests
        run: python -m pytest -q
      - name: Commit patched live core
        shell: bash
        run: |
          if git diff --quiet -- v14_core.py; then
            echo "No live-core changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v14_core.py
          git commit -m "feat: integrate private bulk enrollment bridge"
          git push origin HEAD:ops/bulk-enroll-running-s1-20260914
