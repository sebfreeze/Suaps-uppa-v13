name: Bulk enrollment safety

on:
  push:
    branches:
      - ops/bulk-enroll-running-s1-20260914

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Bulk enrollment tests
        run: python -m pytest -q tests/test_bulk_enrollment.py
