name: Patch modalite columns

on:
  push:
    paths:
      - '.github/workflows/patch-modalite-columns.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch sitecustomize
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('sitecustomize.py')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'st.info("Colonnes obligatoires : nom, prenom, email, activite, creneau. Recommandées : semestre, modalite, jour_horaire. Facultatives : identifiant, composante, profil.")',
              'st.info("Colonnes obligatoires : nom, prenom, email, activite, creneau. Pour la modalité, mettre X dans une seule colonne : UET, UECF ou Non noté. Recommandées : semestre, jour_horaire. Facultatives : identifiant, composante, profil.")'
          )

          old_model = '''            "semestre":"Semestre 1 — 2026/2027","modalite":"UET","activite":"Natation","creneau":"Natation tous niveaux","jour_horaire":"Lundi 18h00"'''
          new_model = '''            "semestre":"Semestre 1 — 2026/2027","UET":"X","UECF":"","Non noté":"","activite":"Natation","creneau":"Natation tous niveaux","jour_horaire":"Lundi 18h00"'''
          if old_model not in s:
              raise SystemExit('model pattern not found')
          s = s.replace(old_model, new_model, 1)

          old_guide = '''            {"colonne":"modalite","statut":"Recommandé","type / valeurs":"UET, UECF ou Non noté","exemple":"UET"},'''
          new_guide = '''            {"colonne":"UET","statut":"Modalité","type / valeurs":"Mettre X si l'étudiant est inscrit en UET","exemple":"X"},
            {"colonne":"UECF","statut":"Modalité","type / valeurs":"Mettre X si l'étudiant est inscrit en UECF","exemple":""},
            {"colonne":"Non noté","statut":"Modalité","type / valeurs":"Mettre X si l'inscription n'est pas notée","exemple":""},'''
          if old_guide not in s:
              raise SystemExit('guide pattern not found')
          s = s.replace(old_guide, new_guide, 1)

          old_widths = '''            for _col,_width in {"A":16,"B":16,"C":32,"D":16,"E":18,"F":16,"G":28,"H":16,"I":22,"J":28,"K":22}.items(): _ws.column_dimensions[_col].width=_width'''
          new_widths = '''            for _col,_width in {"A":16,"B":16,"C":32,"D":16,"E":18,"F":16,"G":28,"H":10,"I":10,"J":12,"K":22,"L":28,"M":22}.items(): _ws.column_dimensions[_col].width=_width'''
          if old_widths not in s:
              raise SystemExit('width pattern not found')
          s = s.replace(old_widths, new_widths, 1)

          old_modalite = '''                            modalite=clean("modalite","Non noté")
                            norm_mod={"uet":"UET","uecf":"UECF","non note":"Non noté","non noté":"Non noté","non-note":"Non noté"}
                            modalite=norm_mod.get(modalite.lower(),modalite)
                            if modalite not in ("UET","UECF","Non noté"):
                                errors.append({"ligne":line,"email":email,"erreur":"Modalité inconnue : "+modalite}); continue'''
          new_modalite = '''                            modalite=clean("modalite","")
                            _flags=[]
                            def _marked(name):
                                return clean(name).lower() in ("x","1","oui","yes","true","vrai")
                            if _marked("uet"): _flags.append("UET")
                            if _marked("uecf"): _flags.append("UECF")
                            if _marked("non note"): _flags.append("Non noté")
                            if len(_flags)>1:
                                errors.append({"ligne":line,"email":email,"erreur":"Une seule modalité doit être cochée : UET, UECF ou Non noté"}); continue
                            if _flags: modalite=_flags[0]
                            if not modalite: modalite="Non noté"
                            norm_mod={"uet":"UET","uecf":"UECF","non note":"Non noté","non noté":"Non noté","non-note":"Non noté"}
                            modalite=norm_mod.get(modalite.lower(),modalite)
                            if modalite not in ("UET","UECF","Non noté"):
                                errors.append({"ligne":line,"email":email,"erreur":"Modalité inconnue : "+modalite}); continue'''
          if old_modalite not in s:
              raise SystemExit('modalite pattern not found')
          s = s.replace(old_modalite, new_modalite, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Syntax check
        run: python -m py_compile sitecustomize.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitecustomize.py
          git diff --cached --quiet && exit 0
          git commit -m 'Ajoute colonnes UET UECF Non noté au modèle import'
          git push
