name: Test attendance flow links

on:
  push:
    branches:
      - fix/attendance-flow-links-tdd

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile changed patch
        run: python -m py_compile presence_note_live_patch.py
      - name: Run attendance flow tests
        run: python -m pytest -q tests/test_attendance_flow_links.py
      - name: Run regression suite except obsolete entrypoint assertion
        run: python -m pytest -q -k "not test_render_entrypoint_applies_pedagogy_patch"
