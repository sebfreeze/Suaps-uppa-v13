name: Patch CSV Excel import

on:
  push:
    paths:
      - '.github/workflows/patch-csv-excel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch import export
        run: python .github/scripts/patch_csv_excel.py
      - name: Validate
        run: |
          python -m py_compile sitecustomize.py v14_complete.py v15_base.py v14_core.py
          python - <<'PY'
          from pathlib import Path
          s=Path('sitecustomize.py').read_text(encoding='utf-8')
          for x in ['Télécharger le modèle Excel','type=["csv","xlsx"]','pd.read_excel(import_file,sheet_name="Import")','columns=ins_cols','columns=pre_cols','columns=eva_cols']:
              assert x in s, x
          print('CSV / Excel patch validated')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitecustomize.py
          git diff --cached --quiet && exit 0
          git commit -m "Fiabilise import export CSV et ajoute modele Excel"
          git push origin main
