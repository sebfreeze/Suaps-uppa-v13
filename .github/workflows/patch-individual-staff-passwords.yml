name: Individual staff passwords

on:
  push:
    paths:
      - '.github/workflows/patch-individual-staff-passwords.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch staff authentication
        run: python .github/scripts/patch_individual_staff_passwords.py
      - name: Validate
        run: |
          python -m py_compile security_bootstrap/sitecustomize.py
          python - <<'PY'
          from pathlib import Path
          s=Path('security_bootstrap/sitecustomize.py').read_text(encoding='utf-8')
          checks=[
              'STAFF_PASSWORD_HASH_HERVE',
              'STAFF_PASSWORD_HASH_SEBASTIEN',
              'hashlib.pbkdf2_hmac',
              'Mot de passe individuel',
              '_staff_password_ok(_person["nom"],_entered)',
          ]
          for x in checks:
              assert x in s, x
          assert 'Code enseignant commun' not in s
          assert 'TEACHER_ACCESS_CODE' not in s
          assert 'secrets.compare_digest(_entered.strip(),_teacher_code)' not in s
          print('Individual staff authentication validated')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security_bootstrap/sitecustomize.py
          git diff --cached --quiet && exit 0
          git commit -m "Supprime définitivement le code enseignant commun"
          git push origin main
