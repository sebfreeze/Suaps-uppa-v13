name: Test ressources pédagogiques

on:
  push:
    paths:
      - 'pedagogie_*.py'
      - 'app_design_pedagogie.py'
      - 'tests/test_pedagogie_*.py'
      - 'requirements-dev.txt'
      - '.github/workflows/test-pedagogie.yml'
  pull_request:
    paths:
      - 'pedagogie_*.py'
      - 'app_design_pedagogie.py'
      - 'tests/test_pedagogie_*.py'
      - 'requirements-dev.txt'
      - '.github/workflows/test-pedagogie.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances de test
        run: python -m pip install -r requirements-dev.txt
      - name: Compiler les modules
        run: python -m py_compile pedagogie_resources.py pedagogie_seed.py pedagogie_integration.py app_design_pedagogie.py
      - name: Exécuter les tests
        run: python -m pytest tests/test_pedagogie_resources.py tests/test_pedagogie_seed.py tests/test_pedagogie_integration.py -v
