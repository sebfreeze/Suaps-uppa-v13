name: Manual course registration

on:
  push:
    branches:
      - feat/manual-course-registration

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply manual registration UI patch
        run: python .github/scripts/patch_manual_course_registration.py
      - name: Compile
        run: python -m py_compile qr_registration.py v14_core.py .github/scripts/patch_manual_course_registration.py
      - name: Manual registration tests
        run: python -m pytest -q tests/test_manual_registration.py tests/test_manual_registration_patch.py
      - name: Regression tests
        run: python -m pytest -q
      - name: Commit patched live core
        shell: bash
        run: |
          if git diff --quiet -- v14_core.py; then
            echo "No live-core patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v14_core.py
          git commit -m "feat: integrate manual course registration into live app"
          git push origin HEAD:feat/manual-course-registration
