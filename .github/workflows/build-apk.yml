name: Build APK SUAPS UPPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SUAPS-UPPA-V14.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SUAPS-UPPA-V14-APK
          path: SUAPS-UPPA-V14.apk
