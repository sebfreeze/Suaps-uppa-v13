<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { font-family: system-ui, -apple-system, sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 3px; color: #f8fafc; background: transparent; }
    .timer { text-align: center; background: #102338; border: 1px solid #355475;
             border-radius: 16px; padding: 14px 10px 12px; }
    .hint { font-size: 13px; letter-spacing: .04em; font-weight: 600; color: #c5d9ec; }
    .digits { font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, Consolas, monospace;
              font-size: clamp(38px, 10vw, 76px); font-weight: 850; line-height: 1.4;
              letter-spacing: -.04em; white-space: nowrap; }
    .status { margin-bottom: 12px; font-size: 13px; color: #bcd3eb; min-height: 18px; }
    .actions { display: flex; gap: 10px; }
    button { cursor: pointer; touch-action: manipulation; min-height: 60px; padding: 12px 8px;
             border: none; border-radius: 12px; font-size: clamp(15px, 3.5vw, 19px);
             font-weight: 800; flex: 1; }
    button:disabled { cursor: default; opacity: .42; }
    #go { background: #22c55e; color: #052814; flex: .9; }
    #split { background: #eaf3ff; color: #123354; flex: 1.6; }
    #split.final { background: #fbbf24; color: #3d2300; }
    #stop { background: #f97373; color: #401010; margin-top: 10px; width: 100%; }
    #last { margin: 10px 0 1px; min-height: 18px; font-size: 13px; color: #c9e4f8; }
    .relay-panel { margin-top: 12px; padding: 10px; text-align: left;
                   background: #172f49; border-radius: 12px; }
    .relay-title { display: flex; justify-content: space-between; align-items: center;
                   font-size: 14px; font-weight: 800; margin-bottom: 6px; }
    #relay-progress { color: #c5d9ec; font-variant-numeric: tabular-nums; }
    .relay-table-scroll { max-height: 188px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
    .relay-table { width: 100%; border-collapse: collapse; font-size: 14px;
                   font-variant-numeric: tabular-nums; }
    .relay-table th, .relay-table td { padding: 6px 4px; border-bottom: 1px solid #36536d; }
    .relay-table th { color: #c3d7ea; font-size: 12px; position: sticky; top: 0; background: #172f49; }
    .relay-table th:not(:first-child), .relay-table td:not(:first-child) { text-align: right; }
    .relay-table td:last-child { font-weight: 750; }
    #relay-total { text-align: right; margin-top: 8px; font-weight: 800; font-size: 15px; }
    .relay-empty { color: #bcd3eb; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <div class="timer" aria-label="Chronomètre natation">
    <div class="hint">⏱ CHRONOMÈTRE EN DIRECT</div>
    <div class="digits" id="clock" role="timer" aria-live="off">00:00.00</div>
    <div class="status" id="status">Prêt au départ</div>
    <div class="actions">
      <button id="go" type="button">▶ DÉPART</button>
      <button id="split" type="button" disabled>⏱ PASSAGE</button>
    </div>
    <button id="stop" type="button" disabled>🏁 ARRÊTER / TEMPS FINAL</button>
    <div id="last" aria-live="polite">Les temps sont enregistrés au toucher du bouton.</div>
    <div class="relay-panel" aria-label="Temps individuels et cumulés des relayeurs">
      <div class="relay-title"><span>🏊 Temps des relayeurs</span><span id="relay-progress">0 / 0</span></div>
      <div class="relay-table-scroll">
      <table class="relay-table" aria-label="Temps par relayeur">
        <thead><tr><th>Relayeur</th><th>Individuel</th><th>Cumul équipe</th></tr></thead>
        <tbody id="relay-rows"><tr><td colspan="3" class="relay-empty">En attente du départ</td></tr></tbody>
      </table>
      </div>
      <div id="relay-total">Cumul équipe : 00:00.00</div>
    </div>
  </div>
  <script>
    "use strict";
    const clock = document.getElementById("clock");
    const status = document.getElementById("status");
    const go = document.getElementById("go");
    const split = document.getElementById("split");
    const stop = document.getElementById("stop");
    const last = document.getElementById("last");
    const relayRowsElement = document.getElementById("relay-rows");
    const relayProgress = document.getElementById("relay-progress");
    const relayTotal = document.getElementById("relay-total");
    let relaySplits = [];
    let resultId = null;
    let relayCount = 0;
    let countedSplits = 0;
    let running = false;
    let startEpochMs = 0;
    let startPerfMs = 0;
    let baseSeconds = 0;
    let stoppedSeconds = 0;
    // Un ancien rendu du serveur ne doit jamais redémarrer un chrono arrêté
    // localement pendant que le résultat final est en cours d'enregistrement.
    let localFinalized = false;
    let pendingFinal = false;
    let pendingStart = false;
    let lastReportedFrameHeight = 0;

    function send(type, data) {
      window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, data || {}), "*");
    }
    // Mesure du contenu : scrollHeight pouvait hériter de la hauteur de
    // l’iframe et augmenter l’espace noir à chaque nouveau rendu.
    function reportFrameHeight() {
      const height = Math.ceil(document.querySelector(".timer").getBoundingClientRect().height + 6);
      if (height <= 0 || height === lastReportedFrameHeight) return;
      lastReportedFrameHeight = height;
      send("streamlit:setFrameHeight", {height});
    }
    function sendAction(action, values) {
      send("streamlit:setComponentValue", {
        dataType: "json",
        value: Object.assign({
          action,
          result_id: resultId,
          event_id: Date.now() + "-" + Math.random().toString(36).slice(2),
        }, values || {})
      });
    }
    function elapsed() {
      return running ? Math.max(0, baseSeconds + (performance.now() - startPerfMs) / 1000) : stoppedSeconds;
    }
    function formatTime(secs) {
      const centis = Math.max(0, Math.floor((secs + 0.000001) * 100));
      const minutes = Math.floor(centis / 6000);
      const remainder = centis % 6000;
      return String(minutes).padStart(2, "0") + ":" +
             String(Math.floor(remainder / 100)).padStart(2, "0") + "." +
             String(remainder % 100).padStart(2, "0");
    }
    function validServerSplits(splits) {
      if (!Array.isArray(splits)) return [];
      return splits.map(s => ({
        number: Number(s.numero),
        individual: Number(s.temps_split),
        cumulative: Number(s.temps_cumule)
      })).filter(s =>
        Number.isInteger(s.number) && s.number > 0 &&
        Number.isFinite(s.individual) && s.individual >= 0 &&
        Number.isFinite(s.cumulative) && s.cumulative > 0
      ).sort((a, b) => a.number - b.number);
    }
    function renderRelaySplits() {
      relayProgress.textContent = relaySplits.length + " / " + relayCount;
      relayRowsElement.replaceChildren();
      if (relaySplits.length === 0) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 3;
        td.className = "relay-empty";
        td.textContent = running ? "En attente du premier relais" : "En attente du départ";
        tr.appendChild(td);
        relayRowsElement.appendChild(tr);
      }
      for (const item of relaySplits) {
        const tr = document.createElement("tr");
        for (const value of ["N° " + item.number, formatTime(item.individual), formatTime(item.cumulative)]) {
          const td = document.createElement("td");
          td.textContent = value;
          tr.appendChild(td);
        }
        relayRowsElement.appendChild(tr);
      }
      const cumulative = relaySplits.length ? relaySplits[relaySplits.length - 1].cumulative : 0;
      const total = !running && stoppedSeconds > 0 ? stoppedSeconds : cumulative;
      relayTotal.textContent = "Cumul équipe : " + formatTime(total) +
        (!running && stoppedSeconds > cumulative + 0.01 && relaySplits.length < relayCount
          ? " (passages manquants)" : "");
      reportFrameHeight();
    }
    function refreshButtons() {
      go.disabled = running || localFinalized;
      split.disabled = !running || countedSplits >= relayCount;
      stop.disabled = !running;
      split.classList.toggle("final", relayCount > 0 && countedSplits === relayCount - 1);
      split.textContent = relayCount > 0 && countedSplits === relayCount - 1
        ? "🏁 ARRIVÉE / TEMPS FINAL"
        : "⏱ RELAYEUR " + (countedSplits + 1) + " / " + relayCount;
      status.textContent = running
        ? "En cours • " + countedSplits + " / " + relayCount + " passage(s)"
        : pendingFinal ? "Chrono arrêté • enregistrement du temps final…"
        : (stoppedSeconds > 0 ? "Terminé • temps enregistré" : "Prêt au départ");
      renderRelaySplits();
    }
    function tick() {
      clock.textContent = formatTime(elapsed());
      requestAnimationFrame(tick);
    }
    function configure(args) {
      if (!args || args.result_id == null) return;
      const incomingId = Number(args.result_id);
      const incomingRunning = Boolean(args.running);
      const incomingStart = Number(args.start_epoch || 0) * 1000;
      const newResult = incomingId !== resultId;
      relayCount = Number(args.relay_count || 0);
      const savedSplits = validServerSplits(args.saved_splits);
      if (newResult) {
        relaySplits = savedSplits;
        resultId = incomingId;
        countedSplits = Math.max(Number(args.split_count || 0), relaySplits.length);
        stoppedSeconds = Number(args.final_seconds || 0);
        running = incomingRunning;
        localFinalized = !incomingRunning && stoppedSeconds > 0;
        pendingFinal = false;
        pendingStart = false;
        startEpochMs = incomingStart;
        if (running) {
          baseSeconds = Math.max(0, (Date.now() - startEpochMs) / 1000);
          startPerfMs = performance.now();
        }
        last.textContent = "Un passage = un temps intermédiaire, sans arrêter le chrono.";
      } else {
        // Les relais s'affichent immédiatement au toucher ; les données du serveur
        // reprennent la main après leur enregistrement, sans effacer les clics en attente.
        if (savedSplits.length > relaySplits.length ||
            (!running && !pendingFinal && savedSplits.length === relaySplits.length)) {
          relaySplits = savedSplits;
        }
        countedSplits = Math.max(countedSplits, Number(args.split_count || 0), relaySplits.length);
        if (incomingRunning) pendingStart = false;
        if (incomingRunning && !running && !localFinalized) {
          running = true;
          startEpochMs = incomingStart;
          baseSeconds = Math.max(0, (Date.now() - startEpochMs) / 1000);
          startPerfMs = performance.now();
        } else if (!incomingRunning && running && !pendingStart) {
          // Arrêt ou saisie manuelle reçu du serveur.
          stoppedSeconds = Number(args.final_seconds || 0);
          running = false;
          localFinalized = stoppedSeconds > 0;
          pendingFinal = false;
          if (args.final_seconds == null) countedSplits = Number(args.split_count || 0);
        } else if (!incomingRunning && !running) {
          if (Number(args.final_seconds || 0) > 0) {
            stoppedSeconds = Number(args.final_seconds);
            localFinalized = true;
            pendingFinal = false;
            pendingStart = false;
            last.textContent = "Temps final confirmé et enregistré.";
          } else if (!pendingFinal && Number(args.split_count || 0) === 0) {
            // Remise à zéro volontaire dans l'application.
            stoppedSeconds = 0;
            localFinalized = false;
            countedSplits = 0;
            relaySplits = [];
          }
        }
      }
      refreshButtons();
      reportFrameHeight();
    }
    go.addEventListener("click", () => {
      if (running || resultId == null) return;
      running = true;
      countedSplits = 0;
      relaySplits = [];
      stoppedSeconds = 0;
      localFinalized = false;
      pendingFinal = false;
      pendingStart = true;
      startEpochMs = Date.now();
      startPerfMs = performance.now();
      baseSeconds = 0;
      last.textContent = "Départ enregistré sur le téléphone.";
      refreshButtons();
      sendAction("start", {start_epoch: startEpochMs / 1000});
    });
    split.addEventListener("click", () => {
      if (!running || countedSplits >= relayCount) return;
      // Mesure prise ici, avant l'échange réseau avec le serveur Streamlit.
      const sec = Math.round(elapsed() * 100) / 100;
      const previous = relaySplits.length ? relaySplits[relaySplits.length - 1].cumulative : 0;
      if (sec <= previous) return;
      countedSplits++;
      const individual = Math.round((sec - previous) * 100) / 100;
      relaySplits.push({number: countedSplits, individual, cumulative: sec});
      const final = countedSplits === relayCount;
      if (final) {
        stoppedSeconds = sec;
        running = false;
        localFinalized = true;
        pendingFinal = true;
      }
      last.textContent = (final ? "Arrivée" : "Relayeur " + countedSplits) +
        " : " + formatTime(individual) + " • cumul " + formatTime(sec) + " — enregistrement…";
      refreshButtons();
      sendAction("split", {elapsed_seconds: sec, split_number: countedSplits});
    });
    stop.addEventListener("click", () => {
      if (!running || resultId == null) return;
      const sec = Math.round(elapsed() * 100) / 100;
      if (sec <= 0) return;
      stoppedSeconds = sec;
      running = false;
      localFinalized = true;
      pendingFinal = true;
      last.textContent = "Arrivée : " + formatTime(sec) + " — enregistrement…";
      refreshButtons();
      sendAction("finish", {elapsed_seconds: sec});
    });
    window.addEventListener("message", event => {
      if (event.data && event.data.type === "streamlit:render") configure(event.data.args);
    });
    send("streamlit:componentReady", {apiVersion: 1});
    window.addEventListener("resize", reportFrameHeight);
    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(reportFrameHeight).observe(document.querySelector(".timer"));
    }
    reportFrameHeight();
    requestAnimationFrame(tick);
    window.addEventListener("load", () => {
      reportFrameHeight();
    });
  </script>
</body>
</html>
